<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Project Details — Aderoju Olaide Portfolio</title>
  <meta content="" name="description">
  <meta content="" name="keywords">
  <meta name="theme-color" content="#08080a">

  <!-- Favicons -->
  <link href="assets/img/logo-mark.png" rel="icon">
  <link href="assets/img/logo-mark.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

  <!-- Motion is only enabled once JS is known to be running -->
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () {
      if (!window.__portfolioReady) document.documentElement.classList.remove("js");
    }, 4000);
  </script>
</head>

<body class="tone-dark">
  <!-- ======= Floating Nav ======= -->
  <header class="nav" id="nav" data-tone="dark">
    <div class="nav__pill">
      <a href="index.html" class="nav__brand" aria-label="Aderoju Olaide — home">
        <span class="brand-mark"><img src="assets/img/logo-mark.png" alt=""></span>
        <span class="nav__name">Aderoju Olaide</span>
      </a>
      <a href="index.html#portfolio" class="nav__cta"><i class="bi bi-arrow-left"></i>&nbsp; All work</a>
    </div>
  </header>

  <main id="main" class="detail">

    <!-- ======= Portfolio Details Section ======= -->
    <section id="portfolio-details" class="wrap">

      <!-- Dynamic project title -->
      <p class="detail__category" id="detailCategory" data-reveal>Project</p>
      <h1 class="display" id="detailTitle" data-reveal>Loading...</h1>

      <div class="detail__grid">

        <!-- Image Slider -->
        <div class="portfolio-details-slider swiper" data-reveal>
          <div class="swiper-wrapper" id="detailSlider">
            <!-- Slides injected dynamically -->
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>

        <!-- Project Info -->
        <div class="detail__aside" data-reveal>
          <h2>Project Information</h2>
          <div class="detail-info-grid">
            <div class="detail-info-item">
              <span class="detail-label">Category</span>
              <span class="detail-value" id="detailCategoryValue">—</span>
            </div>
            <div class="detail-info-item">
              <span class="detail-label">Role</span>
              <span class="detail-value" id="detailRole">—</span>
            </div>
            <div class="detail-info-item">
              <span class="detail-label">Client</span>
              <span class="detail-value" id="detailClient">—</span>
            </div>
            <div class="detail-info-item">
              <span class="detail-label">Date</span>
              <span class="detail-value" id="detailDate">—</span>
            </div>
          </div>

          <!-- Technologies -->
          <div class="detail-technologies" id="detailTechnologies">
            <!-- Tech badges injected dynamically -->
          </div>

          <!-- Action Buttons -->
          <div class="detail-actions">
            <a href="#" class="btn btn--solid" id="detailLiveLink" target="_blank" rel="noopener">
              Live Preview <i class="bi bi-arrow-up-right"></i>
            </a>
            <a href="#" class="btn btn--ghost" id="detailGithubLink" target="_blank" rel="noopener" style="display:none;">
              <i class="bi bi-github"></i> View Code
            </a>
            <a href="#" class="btn btn--ghost" id="detailFigmaLink" target="_blank" rel="noopener" style="display:none;">
              <i class="bi bi-vector-pen"></i> View in Figma
            </a>
          </div>

          <!-- Project Description -->
          <div class="portfolio-detail-description">
            <h2>About This Project</h2>
            <p id="detailDescription">Loading project description...</p>
          </div>
        </div>

      </div>

      <!-- Navigation between projects -->
      <div class="project-navigation">
        <a href="#" class="btn btn--ghost" id="prevProject">
          <i class="bi bi-arrow-left"></i> Previous Project
        </a>
        <a href="index.html#portfolio" class="btn btn--ghost">
          <i class="bi bi-grid-3x3-gap"></i> All Projects
        </a>
        <a href="#" class="btn btn--ghost" id="nextProject">
          Next Project <i class="bi bi-arrow-right"></i>
        </a>
      </div>

    </section>
    <!-- End Portfolio Details Section -->

  </main><!-- End #main -->

  <!-- Vendor JS Files -->
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Projects Data -->
  <script src="assets/js/projects.js"></script>
  <!-- Main JS File -->
  <script src="assets/js/main.js"></script>
</body>

</html>
